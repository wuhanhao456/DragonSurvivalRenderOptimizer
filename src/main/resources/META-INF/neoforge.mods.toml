modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayTest = "IGNORE_SERVER_VERSION"
description = '''
    一个面向 Dragon Survival 的实验性客户端渲染后端。
    该模组会在常规龙形态渲染时切换到 BedrockPart 渲染路径，
    特殊动画则自动回退到 Dragon Survival 原版 GeckoLib 渲染。
    '''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "dragonsurvival"
type = "required"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "${mod_id}.mixins.json"
